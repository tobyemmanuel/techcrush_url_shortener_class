openapi: 3.0.3
info:
  title: URL Shortener API
  version: 1.0.0
  description: |
    Authentication uses an httpOnly cookie named `token`, set by `POST /auth/login`.
    Send requests with cookies enabled (`credentials: 'include'` in fetch, or a cookie jar in Postman).
    Every JSON response has the shape `{ success, message, data?, meta?, errors? }`.
servers:
  - url: http://localhost:3000
tags:
  - name: Auth
  - name: URLs
  - name: Redirect
  - name: Admin

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200': { description: Server is running }

  /{code}:
    get:
      tags: [Redirect]
      summary: Redirect to the original URL and record a click
      security: []
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '302': { description: Redirects to the original URL }
        '404': { description: Unknown, inactive or invalid code }
        '410': { description: The link has expired }

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Create an account and send a verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72, description: At least one letter and one number }
      responses:
        '201': { description: Account created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Email already registered }

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive the auth cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200': { description: Logged in. The `token` cookie is set }
        '401': { description: Wrong email or password }
        '403': { description: Email not verified or account deactivated }

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Clear the auth cookie
      responses:
        '200': { description: Logged out }

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: The logged in user
      responses:
        '200': { description: Current user }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/auth/verify-email:
    get:
      tags: [Auth]
      summary: Confirm an email address (the link sent by email)
      security: []
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Email verified }
        '400': { description: Invalid or expired link }

  /api/v1/auth/resend-verification:
    post:
      tags: [Auth]
      summary: Send a new verification email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Always succeeds, so account existence is not revealed }

  /api/v1/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Email a password reset link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Always succeeds, so account existence is not revealed }

  /api/v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Set a new password using the emailed token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '200': { description: Password reset }
        '400': { description: Invalid or expired token }

  /api/v1/auth/password:
    patch:
      tags: [Auth]
      summary: Change password while logged in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '200': { description: Password changed. Other sessions are signed out }
        '400': { description: Wrong current password or validation error }

  /api/v1/urls:
    post:
      tags: [URLs]
      summary: Create a short link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originalUrl]
              properties:
                originalUrl: { type: string, format: uri, maxLength: 2048 }
                customAlias: { type: string, pattern: '^[A-Za-z0-9_-]{3,32}$' }
                expiresAt: { type: string, format: date-time, description: Must be in the future }
      responses:
        '201': { description: Link created }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Alias already taken }
    get:
      tags: [URLs]
      summary: List your short links
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: q, in: query, description: Search in code and original URL, schema: { type: string } }
        - { name: isActive, in: query, schema: { type: boolean } }
        - { name: sortBy, in: query, schema: { type: string, enum: [createdAt, clickCount] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200': { description: Paginated list }

  /api/v1/urls/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [URLs]
      summary: Get one short link
      responses:
        '200': { description: The link }
        '404': { description: Not found, or not yours }
    patch:
      tags: [URLs]
      summary: Update a short link
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                originalUrl: { type: string, format: uri }
                isActive: { type: boolean }
                expiresAt: { type: string, format: date-time, nullable: true, description: null removes the expiry }
      responses:
        '200': { description: Updated }
    delete:
      tags: [URLs]
      summary: Delete a short link and its click history
      responses:
        '200': { description: Deleted }

  /api/v1/urls/{id}/stats:
    get:
      tags: [URLs]
      summary: Click statistics
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 7 } }
      responses:
        '200': { description: Total clicks, clicks per day and top referrers }

  /api/v1/admin/stats:
    get:
      tags: [Admin]
      summary: Platform totals and cache statistics
      responses:
        '200': { description: Statistics }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: List users
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string, enum: [user, admin] } }
      responses:
        '200': { description: Paginated users }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/users/{id}/role:
    patch:
      tags: [Admin]
      summary: Change a user's role
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [user, admin] }
      responses:
        '200': { description: Role updated }
        '400': { description: You cannot change your own role }

  /api/v1/admin/users/{id}/status:
    patch:
      tags: [Admin]
      summary: Activate or deactivate a user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        '200': { description: Status updated }

  /api/v1/admin/urls:
    get:
      tags: [Admin]
      summary: List every short link with its owner
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200': { description: Paginated links }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
  responses:
    ValidationError:
      description: One or more fields are invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: false }
              message: { type: string, example: Validation failed }
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field: { type: string }
                    message: { type: string }
    Unauthorized:
      description: Not logged in, or the session expired
    Forbidden:
      description: Logged in but the role is not allowed

security:
  - cookieAuth: []
